[project]
name = "kuni"
version = "0.0.2"
description = "Kuni (くに) — LLM character that lives in Telegram. Python port with graph memory."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "telethon>=1.36",
    "aiohttp>=3.9",
    "prometheus_client>=0.20",
    "tomli_w>=1.0",
    "pillow>=10",
    "qrcode>=7",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kuni = "kuni.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kuni*"]

[tool.setuptools.package-data]
kuni = ["default_prompts/*.md", "webui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a live LLM endpoint / Telegram (deselect with -m 'not integration')"]
